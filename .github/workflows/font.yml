name: font

# 게임 문구에 쓴 글자가 한글 서브셋 글꼴에 다 있는지 본다.
# 실패하면: python3 tools/font_subset.py 로 글꼴을 다시 만들어 커밋한다.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  font-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install fonttools==4.68.0
      - name: 글꼴에 빠진 글자 검사
        run: python3 tools/font_subset.py --check
