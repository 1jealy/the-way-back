<svg xmlns="http://www.w3.org/2000/svg" width="320" height="330" viewBox="0 0 320 330">
  <!-- 할아버지 연(마름모 천 연) 몸통, 꼬리 없음 (연 날리기에서 꼬리는 코드가 그린다. 게임 크기의 2배). 하윤 그림체: 평면 색 + 그늘 한 톤 + 얇은 따뜻한 윤곽선 -->
  <g stroke-linejoin="round" stroke-linecap="round">
    <!-- 천(네 쪽: 위 둘은 붉은 줄무늬, 아래 둘은 크림색). 위가 짧고 아래가 긴 마름모 -->
    <path d="M160 12 L22 118 L160 320 L298 118 Z" fill="#F6EBD3" stroke="#8B5E3C" stroke-width="3.5"/>
    <path d="M160 12 L22 118 L160 118 Z" fill="#D2554A"/>
    <path d="M160 12 L298 118 L160 118 Z" fill="#E7C46A"/>
    <path d="M160 12 L298 118 L262 118 L160 40 Z" fill="#CFA94F"/>
    <path d="M160 118 L298 118 L160 320 Z" fill="#EAD9B6"/>
    <!-- 천에 꿰맨 땀 -->
    <g stroke="#8B5E3C" stroke-width="2" stroke-dasharray="7 7" fill="none" opacity="0.55">
      <path d="M40 118 L280 118"/>
      <path d="M160 30 L160 300"/>
    </g>
    <!-- 겉 테 다시 -->
    <path d="M160 12 L22 118 L160 320 L298 118 Z" fill="none" stroke="#8B5E3C" stroke-width="3.5" stroke-linejoin="round"/>
    <!-- 뼈대(비치는 살) -->
    <g stroke="#8B6A44" stroke-width="3" fill="none" opacity="0.5">
      <path d="M160 16 V316"/>
      <path d="M26 118 H294"/>
    </g>
    <!-- 덧댄 천 조각(할아버지가 기운 자리) -->
    <path d="M196 170 L232 164 L236 196 L200 202 Z" fill="#9FBAD8" stroke="#8B5E3C" stroke-width="2.5"/>
    <path d="M200 172 L230 167 M202 199 L234 194" stroke="#8B5E3C" stroke-width="1.5" stroke-dasharray="4 4"/>
    <!-- 목줄 매듭 -->
    <circle cx="160" cy="118" r="6" fill="#8B5E3C"/>
  </g>
</svg>
