    <path d="M214 46 L262 30 V132 L214 116 Z" fill="#B8BEC1" stroke="#4A3A2C" stroke-width="3.5"/>
    <path d="M214 98 L262 112 V132 L214 116 Z" fill="#969CA0"/>
    <path d="M222 52 L254 42" stroke="#E2E6E8" stroke-width="4"/>
    <!-- 렌즈 -->
    <ellipse cx="266" cy="81" rx="16" ry="54" fill="#DCE0E2" stroke="#4A3A2C" stroke-width="3.5"/>
    <ellipse cx="268" cy="81" rx="10" ry="44" fill="#FFF1C9"/>
    <ellipse cx="270" cy="66" rx="4" ry="12" fill="#FFFFFF" fill-opacity="0.85"/>
