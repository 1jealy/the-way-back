<svg xmlns="http://www.w3.org/2000/svg" width="340" height="150" viewBox="0 0 340 150">
  <!-- 할아버지 손전등 (게임 크기의 2배). 오른쪽을 비춘다. 오래 써서 손잡이 칠이 벗겨졌다 -->
  <g stroke-linejoin="round" stroke-linecap="round">
