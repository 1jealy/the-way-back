    <rect x="20" y="52" width="196" height="58" rx="12" fill="#5F7D6B" stroke="#4A3A2C" stroke-width="3.5"/>
    <path d="M24 92 H212 V98 Q212 106 204 106 H32 Q24 106 24 98 Z" fill="#4C6858"/>
    <path d="M34 62 H200" stroke="#86A390" stroke-width="5"/>
    <!-- 벗겨진 칠 -->
    <path d="M72 70 C82 66 96 68 100 76 C94 84 80 84 72 80 Z" fill="#C9B79A"/>
    <path d="M140 84 C148 80 158 82 160 88 C154 94 144 92 140 88 Z" fill="#C9B79A"/>
