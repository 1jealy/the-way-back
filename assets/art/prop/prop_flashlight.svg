    <path d="M22 66 C4 70 4 96 22 98" fill="none" stroke="#7A5530" stroke-width="7"/>
    <path d="M22 66 C4 70 4 96 22 98" fill="none" stroke="#B9874F" stroke-width="3.5"/>
