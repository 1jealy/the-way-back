    <!-- 스위치 -->
    <rect x="118" y="38" width="34" height="18" rx="6" fill="#8D9A93" stroke="#4A3A2C" stroke-width="3"/>
    <rect x="128" y="34" width="14" height="10" rx="3" fill="#5D6762" stroke="#4A3A2C" stroke-width="2.5"/>
