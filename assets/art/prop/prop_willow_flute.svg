<svg xmlns="http://www.w3.org/2000/svg" width="360" height="90" viewBox="0 0 360 90">
  <!-- 할아버지가 깎은 나무 피리 (게임 크기의 2배). 짙은 나무, 입에 무는 쪽은 둥글게 깎은 부리, 구멍 셋, 놋쇠 고리 둘 -->
  <g stroke-linejoin="round" stroke-linecap="round">
    <!-- 몸통 -->
    <path d="M48 28 H326 Q342 28 342 45 Q342 62 326 62 H48 Z" fill="#A9733F" stroke="#5E3F22" stroke-width="3.5"/>
    <path d="M48 50 H334 Q338 54 336 56 Q332 62 326 62 H48 Z" fill="#8C5C30"/>
    <path d="M60 35 H318" stroke="#C99560" stroke-width="5"/>
    <!-- 부리(입에 무는 쪽) -->
    <path d="M48 30 Q20 34 12 42 Q10 47 16 52 Q30 58 48 60 Z" fill="#B98450" stroke="#5E3F22" stroke-width="3.5"/>
    <path d="M60 34 L82 34 L76 44 L60 44 Z" fill="#3E2A18" stroke="#5E3F22" stroke-width="2"/>
    <!-- 놋쇠 고리 둘 -->
    <path d="M100 27 H112 V63 H100 Z" fill="#D7B25A" stroke="#7A5A22" stroke-width="2.5"/>
    <path d="M296 27 H308 V63 H296 Z" fill="#D7B25A" stroke="#7A5A22" stroke-width="2.5"/>
    <!-- 구멍 셋 (낮음·가운데·높음) -->
    <ellipse cx="150" cy="44" rx="10" ry="8" fill="#2E1F12" stroke="#5E3F22" stroke-width="2"/>
    <ellipse cx="196" cy="44" rx="10" ry="8" fill="#2E1F12" stroke="#5E3F22" stroke-width="2"/>
    <ellipse cx="242" cy="44" rx="10" ry="8" fill="#2E1F12" stroke="#5E3F22" stroke-width="2"/>
    <!-- 나뭇결 -->
    <g stroke="#7E5128" stroke-width="1.5" fill="none" opacity="0.7">
      <path d="M124 40 C132 38 136 42 140 40"/><path d="M262 38 C272 40 282 38 290 40"/><path d="M120 56 C140 54 160 58 178 56"/>
    </g>
  </g>
</svg>
